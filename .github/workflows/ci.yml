name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actonlang/setup-acton@v1
        with:
          channel: 'tip'
      - name: "Check out repository code"
        uses: actions/checkout@v4
      - name: "Install OpenSSH server for the interop tests"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server
          sudo mkdir -p /run/sshd
      - run: acton test --min-time 2000 --max-time 10000 --tag openssh
      # The write-barrier checker runs each test in generational GC mode and
      # exits with status 70 at a pointer store without its barrier. The
      # checker makes the tests slower: --max-time 10000 gives each test 11 s
      # instead of 3 s, and --min-iter 0 keeps a slow test at one run.
      - name: "Run the tests under the write-barrier checker"
        run: acton test --gc-check --min-iter 0 --max-time 10000 --tag openssh
      # Many concurrent connections: the checker then also finds a uv handle
      # that is not in memory from acton_malloc_rescanned().
      - name: "Run the fan-out program under the write-barrier checker"
        timeout-minutes: 10
        run: |
          acton build --fast
          ACTON_GC_CHECK=1 ./out/bin/fanout 32 50
      # ScpGetScaleTester measured 1.02 to 1.03 GC bytes allocated per byte
      # received, in 32 KiB chunks. The limit of 1.1 leaves room for noise and
      # fails when each chunk costs about 2 KiB more than now. Smaller files
      # are noisier, so the test runs at --scale 50 (MiB). acton test perf
      # does not fail on a change, so jq checks the allocation in its report.
      # With --json, only the report says why the test failed or was skipped,
      # and neither has measurements, so the step prints that first.
      - name: "Check ScpGet's GC allocation per byte received"
        timeout-minutes: 10
        run: |
          rc=0
          acton test perf --tag openssh --module test_scp --name ScpGetScaleTester \
            --scale 50 --json > perf.json || rc=$?
          if [ "$(jq -r '.tests[0].status' perf.json)" != "OK" ]; then
            jq -r '.tests[0] | "ScpGetScaleTester: \(.status): \(.skip_reason // .exception)"' perf.json
            exit 1
          fi
          [ "$rc" -eq 0 ] || exit "$rc"
          ratio=$(jq '.tests[0].performance.measurements
                      | .mem_usage_delta_avg / (.perf_info.scale * 1048576)' perf.json)
          echo "ScpGet: $ratio GC bytes allocated per byte received"
          jq -e -n --argjson r "$ratio" '$r <= 1.1' > /dev/null
